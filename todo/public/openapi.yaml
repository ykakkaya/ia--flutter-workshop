openapi: 3.0.3
info:
  title: Todo API
  version: 1.0.0
  description: |
    Laravel Sanctum token kimlik doğrulamalı todo API'si. Her kullanıcı yalnızca kendi todo'larını görür.

    Önce `/register` veya `/login` ile token alın, sonra sağ üstteki **Authorize** düğmesine yapıştırın.
    `register` ve `login` IP başına dakikada 20 istekle sınırlıdır.
servers:
  - url: /api
tags:
  - name: Auth
  - name: Todos
security:
  - bearerAuth: []
paths:
  /register:
    post:
      tags: [Auth]
      summary: Kayıt ol
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name: { type: string, maxLength: 255, example: Ayşe }
                email: { type: string, format: email, example: ayse@example.com }
                password: { type: string, minLength: 8, example: gizli1234 }
                password_confirmation: { type: string, example: gizli1234 }
      responses:
        '201':
          description: Kullanıcı oluşturuldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /login:
    post:
      tags: [Auth]
      summary: Giriş yap
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: ayse@example.com }
                password: { type: string, example: gizli1234 }
      responses:
        '200':
          description: Giriş başarılı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /logout:
    post:
      tags: [Auth]
      summary: Çıkış yap (kullanılan token'ı siler)
      responses:
        '200':
          description: Çıkış yapıldı
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Çıkış yapıldı. }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /user:
    get:
      tags: [Auth]
      summary: Giriş yapmış kullanıcı
      responses:
        '200':
          description: Kullanıcı
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /todos:
    get:
      tags: [Todos]
      summary: Todo'ları listele (yeniden eskiye)
      parameters:
        - name: status
          in: query
          description: "Durum filtresi. Boş bırakılırsa tümü gelir."
          schema:
            type: string
            enum: [in_progress, completed]
      responses:
        '200':
          description: Todo listesi
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Todo' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Todos]
      summary: Todo oluştur
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TodoInput' }
      responses:
        '201':
          description: Oluşturuldu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /todos/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Todos]
      summary: Tek todo getir
      responses:
        '200':
          description: Todo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Todos]
      summary: Todo'yu güncelle (kısmi)
      description: Yalnızca göndermek istediğiniz alanları yollayın. `description` ve `starts_at` için `null` göndererek temizleyebilirsiniz. `PUT` da aynı şekilde çalışır.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TodoUpdate' }
      responses:
        '200':
          description: Güncellendi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Todo' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Todos]
      summary: Todo'yu sil
      responses:
        '204': { description: Silindi }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "`register` veya `login` yanıtındaki token (örn. `1|abc123...`)"
  schemas:
    User:
      type: object
      properties:
        id: { type: integer, example: 1 }
        name: { type: string, example: Ayşe }
        email: { type: string, format: email, example: ayse@example.com }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AuthResponse:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        token: { type: string, example: 1|abc123def456 }
    Priority:
      type: string
      enum: [low, normal, high]
      description: low = düşük, normal, high = yüksek
    Todo:
      type: object
      properties:
        id: { type: integer, example: 12 }
        user_id: { type: integer, example: 1 }
        title: { type: string, example: Rapor hazırla }
        description: { type: string, nullable: true, example: Aylık satış raporu }
        priority: { $ref: '#/components/schemas/Priority' }
        starts_at: { type: string, format: date-time, nullable: true, description: UTC, example: '2026-11-01T09:30:00.000000Z' }
        completed: { type: boolean, description: "false = devam ediyor, true = tamamlandı" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TodoInput:
      type: object
      required: [title]
      properties:
        title: { type: string, maxLength: 255, example: Rapor hazırla }
        description: { type: string, nullable: true, maxLength: 5000, example: Aylık satış raporu }
        priority: { $ref: '#/components/schemas/Priority' }
        starts_at: { type: string, format: date-time, nullable: true, example: '2026-11-01T09:30:00Z' }
        completed: { type: boolean, default: false }
    TodoUpdate:
      type: object
      properties:
        title: { type: string, maxLength: 255 }
        description: { type: string, nullable: true, maxLength: 5000 }
        priority: { $ref: '#/components/schemas/Priority' }
        starts_at: { type: string, format: date-time, nullable: true }
        completed: { type: boolean, example: true }
    ValidationErrorBody:
      type: object
      properties:
        message: { type: string, example: The title field is required. }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          example: { title: [The title field is required.] }
  responses:
    Unauthenticated:
      description: Token yok veya geçersiz
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string, example: Unauthenticated. }
    NotFound:
      description: Todo bulunamadı veya başka kullanıcıya ait
    ValidationError:
      description: Doğrulama hatası
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationErrorBody' }
    TooManyRequests:
      description: Çok fazla istek (dakikada 20)
